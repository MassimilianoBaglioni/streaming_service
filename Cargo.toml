[package]
name = "streaming_server"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "src-tauri"
]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
crossbeam-channel = "0.5.15"
raw-window-handle = "0.6.2"
softbuffer = "0.4.8"
tokio = "1.49.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
gstreamer = "0.24.4"
gstreamer-app = "0.24.4"
gstreamer-base = "0.24.4"
gstreamer-pbutils = "0.24.4"
gstreamer-rtp = "0.24.4"
gstreamer-video = "0.24.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = {version = "0.13.9", features = ["wayland", "screencast"]}
pipewire = "0.9.2"
winit = { version = "0.30.12", features = ["wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "0.30.12" }