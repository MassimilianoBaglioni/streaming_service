[package]
name = "streaming_server"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "src-tauri"
]

[dependencies]
tokio = "1.49.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
gstreamer = "0.24.4"
gstreamer-app = "0.24.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
iroh = "1.0.0"
anyhow = "1.0.102"
iroh-tickets = "1.0.0"
thiserror = "2.0.18"
tokio-util = "0.7.19"
bytes = "1.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.9", features = ["wayland", "screencast"] }
pipewire = "0.9.2"
winit = { version = "0.30.12", features = ["wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "0.30.12" }
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
] }
