<div class="panel active">
  <div class="page-header">
    <div class="page-title">Stream</div>
    <div class="page-sub">Configure your source and destination, then start streaming.</div>
  </div>

  <!-- SOURCE -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Source</span>
    </div>

    <div class="source-btn">
      <div class="source-ico"></div>

      <div class="source-info">
        <div class="source-name">No source selected</div>
        <div class="source-meta">Click to open the screen picker</div>
      </div>

      <span class="source-action">Select</span>
    </div>
  </div>

  <!-- DESTINATION -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Destination</span>
    </div>

    <div class="two-col">
      <div class="field">
        <span class="field-label">Receiver host</span>
        <input class="field-input" placeholder="IP address" />
      </div>

      <div class="field">
        <span class="field-label">Port</span>
        <input class="field-input" placeholder="5000" />
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" disabled>Start streaming</button>
  </div>
</div>
