[package]
name = "streaming_server_app"
version = "0.1.0"
description = "A peer to peer streaming service"
authors = ["Massimiliano Baglioni"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
streaming_server = {path = "../"}
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
raw-window-handle = "0.6.2"
